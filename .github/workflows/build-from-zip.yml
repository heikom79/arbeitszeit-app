name: Build Android APK from project ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
        
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" yes | sdkmanger --licences

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q arbeitszeit-android-projekt.zip -d extracted

      - name: Build APK
        working-directory: extracted/arbeitszeit-android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: meine-arbeitszeit-apk
          path: extracted/arbeitszeit-android/app/build/outputs/apk/debug/app-debug.apk
          
